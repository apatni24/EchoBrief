name: Keep Render Server Alive

on:
  schedule:
    # Render free tier spins down after ~15 min of inactivity; ping every 10 min
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping EchoBrief backend
        run: |
          url="https://echobrief-backend.onrender.com/cache/stats"
          # Retry because free-tier instances can be briefly unavailable while waking up.
          status=$(curl -sS -L --retry 4 --retry-delay 15 --retry-all-errors -o /tmp/response.json -w "%{http_code}" "$url")
          echo "HTTP $status"
          if [ -f /tmp/response.json ]; then
            cat /tmp/response.json
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Health check failed"
            exit 1
          fi
