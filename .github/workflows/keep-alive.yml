name: Keep Render Server Alive

on:
  schedule:
    # Render free tier spins down after ~15 min of inactivity; ping every 10 min
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping EchoBrief backend
        run: |
          url="https://echobrief-backend.onrender.com/cache/stats"
          status=$(curl -sf -o /tmp/response.json -w "%{http_code}" "$url")
          echo "HTTP $status"
          cat /tmp/response.json
          if [ "$status" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
